aid: doctor-droid
name: Doctor Droid
description: >-
  Doctor Droid (DrDroid), built by Deep Sea Tech Inc., is an AI-powered SRE and on-call agent that
  builds a knowledge graph of your technology stack — cloud, code, and telemetry — to accelerate
  incident response and root-cause analysis. DroidAgent runs automated investigations from the
  dashboard, from Slack, or through a hosted Model Context Protocol (MCP) server in tools like Cursor
  and Claude Desktop, correlating alerts across observability sources (Datadog, Grafana, Prometheus,
  CloudWatch, Sentry, New Relic, SigNoz and dozens more) and suggesting or executing remediation. The
  platform ships open-source tooling including the PlayBooks runbook-automation engine and the
  droidctx infrastructure-context CLI, and is SOC 2 Type II and ISO 27001 certified.
