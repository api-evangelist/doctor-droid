generated: '2026-07-18'
method: searched
status: published
source: https://docs.drdroid.io/getting-started/drdroid-mcp-server
server:
  name: drdroid
  transport: http
  url: https://aiops.drdroid.io/mcp/
  authentication:
    type: bearer
    description: Bearer token. Generate an API key from the DrDroid dashboard under Settings > Proxy Tokens,
      API Keys & MCP and pass it in the Authorization header.
    header: Authorization
  client_config_example:
    mcpServers:
      drdroid:
        url: https://aiops.drdroid.io/mcp/
        headers:
          Authorization: Bearer YOUR_API_KEY
  clients:
  - Claude Desktop
  - Cursor
  - Windsurf
tool_groups:
- category: read
  capabilities:
  - Search alerts
  - Search resources / service catalog
  - Search investigations
  - Search runbooks
- category: write
  capabilities:
  - Update services
  - Create / update runbooks
- category: config
  capabilities:
  - Read / write alert definitions
  - Read / write auto-investigation rules
notes: DrDroid also publishes open-source MCP servers for individual data sources under github.com/DrDroidLab
  (signoz-mcp-server, metabase-mcp-server, mcp-server-template); this artifact captures the first-party
  hosted DrDroid platform MCP server.
deployment:
  mode: remote
  endpoint: https://aiops.drdroid.io/mcp/
  verified: probed
  probe: gated
  checked: '2026-08-12'
  source: catalog MCP census
